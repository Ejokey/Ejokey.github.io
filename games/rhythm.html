<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140f24">
<title>Ритм — Игротека</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="common.css">
<style>
  html, body { overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .songs { display: grid; gap: 10px; }
  .song {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: left;
    padding: 14px 16px; border-radius: 16px; border: 3px solid transparent; background: var(--ink-2);
  }
  .song b { font-size: 20px; font-weight: 900; }
  .song small { grid-column: 1; color: var(--muted); font-size: 14px; font-weight: 600; }
  .song span { grid-row: 1 / span 2; grid-column: 2; font-size: 13px; font-weight: 800; color: var(--muted); text-align: right; }
  .song[aria-pressed="true"] { border-color: var(--c); background: color-mix(in oklch, var(--c) 16%, var(--ink-2)); }
  .song { position: relative; width: 100%; }
  .song .del { position: absolute; top: -8px; right: -8px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink-3); color: var(--text); font-size: 18px; font-weight: 900; line-height: 1; box-shadow: 0 2px 0 oklch(0.1 0.04 290); }
  .addsong {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px;
    border: 2px dashed var(--line); background: transparent; color: var(--text); font-weight: 800; font-size: 17px;
  }
  .addsong:active { background: var(--ink-2); }
  .scroll { max-height: 42dvh; overflow-y: auto; display: grid; gap: 10px; padding: 8px 8px 4px; margin: -8px -8px 0; }
  .progress { height: 10px; border-radius: 999px; background: var(--ink-3); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--cyan); transition: width 150ms; }
  .lat { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-weight: 700; color: var(--muted); font-size: 14px; }
  .lat input { accent-color: var(--cyan); width: 100%; }
  .grade { font-size: 96px; font-weight: 900; line-height: 1; }
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .res div { display: grid; padding: 8px; border-radius: 12px; background: var(--ink-2); }
  .res b { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .res small { font-size: 12px; color: var(--muted); font-weight: 700; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Ритм</h1>
    <p>Играй под музыку: жми ноты в такт или лети по трассе. Можно загрузить свой трек.</p>
    <div class="scroll"><div class="songs" id="songs"></div></div>
    <label class="addsong" for="file">+ Своя музыка с телефона</label>
    <input type="file" id="file" accept="audio/*" hidden>
    <div class="seg" role="group" aria-label="Режим игры">
      <button type="button" data-play="notes" aria-pressed="true">Ноты</button>
      <button type="button" data-play="surf" aria-pressed="false">Сёрф</button>
    </div>
    <p id="playHint" style="font-size:15px"></p>
    <div class="seg" role="group" aria-label="Сложность">
      <button type="button" data-diff="0" aria-pressed="false">Легко</button>
      <button type="button" data-diff="1" aria-pressed="true">Норм</button>
      <button type="button" data-diff="2" aria-pressed="false">Жёстко</button>
    </div>
    <label class="lat">Задержка<input type="range" id="lat" min="-150" max="250" step="5"><output id="latOut"></output></label>
    <button class="btn" type="button" id="start">Играть</button>
  </div>
</div>

<div class="overlay" id="busy" hidden>
  <div class="panel">
    <h1 id="busyTitle" style="font-size:30px">Слушаю трек…</h1>
    <p id="busyText">Ищу темп и удары, это займёт несколько секунд.</p>
    <div class="progress"><i id="busyBar"></i></div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <div class="grade" id="grade"></div>
    <h1 id="overTitle" style="font-size:28px"></h1>
    <div class="res" id="res"></div>
    <p id="overNote"></p>
    <div class="choices">
      <button class="btn" type="button" id="again">Ещё раз</button>
      <button class="btn ghost" type="button" id="overMenu">Другой трек</button>
    </div>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="panel">
    <h1>Пауза</h1>
    <div class="choices">
      <button class="btn" type="button" id="restart">Начать заново</button>
      <button class="btn ghost" type="button" id="quit">Выйти в меню</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="beatmap.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c');
let W, H, ctx;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { pink: css('--pink'), cyan: css('--cyan'), yellow: css('--yellow'), lime: css('--lime'), orange: css('--orange'), red: css('--red'), ink: css('--ink'), ink2: css('--ink-2'), text: css('--text'), muted: css('--muted') };
const LANE_COL = [COL.pink, COL.yellow, COL.lime, COL.cyan];

/* ---------- songs: everything is generated from a seed, so notes always match the music ---------- */
const SONGS = [
  { id: 'neon', name: 'Неон', desc: 'Синтвейв, ночной город', bpm: 112, root: 57, mode: 'minor', prog: [0, 5, 3, 4], bars: 26, seed: 7, color: COL.pink, style: 'synth' },
  { id: 'turbo', name: 'Турбо', desc: 'Быстрый драм-н-бейс', bpm: 164, root: 50, mode: 'minor', prog: [0, 3, 5, 4], bars: 40, seed: 21, color: COL.cyan, style: 'dnb' },
  { id: 'chill', name: 'Чилл', desc: 'Лоу-фай, расслабиться', bpm: 84, root: 60, mode: 'major', prog: [0, 5, 3, 4], bars: 20, seed: 3, color: COL.lime, style: 'lofi' },
];
// Public-domain classics in our own arrangements. Bars are 16 sixteenths; "B3:2" = note B3 for two 16ths, "r:4" = rest.
const CLASSICS = [
  { id: 'grieg', name: 'Горный король', desc: 'Григ · рок, разгоняется', bpm: 138, style: 'rock', color: COL.orange,
    bars: [
      ['B3:2 C#4:2 D4:2 E4:2 F#4:2 D4:2 F#4:4', 'Bm'], ['F4:2 C#4:2 F4:4 E4:2 C4:2 E4:4', 'C# C'],
      ['B3:2 C#4:2 D4:2 E4:2 F#4:2 D4:2 F#4:2 B4:2', 'Bm'], ['A4:2 F#4:2 D4:2 F#4:2 A4:8', 'D']],
    passes: [[0, 1], [0, 1], [12, 1], [12, 1], [0, 0.5], [0, 0.5], [12, 0.5], [12, 0.5]] },
  { id: 'mozart', name: 'Турецкий марш', desc: 'Моцарт · синт-рок', bpm: 132, style: 'synth', color: COL.cyan,
    bars: [
      ['B3:1 A3:1 G#3:1 A3:1 C4:4 D4:1 C4:1 B3:1 C4:1 E4:4', 'Am'], ['F4:1 E4:1 D#4:1 E4:1 B4:1 A4:1 G#4:1 A4:1 B4:1 A4:1 G#4:1 A4:1 C5:4', 'Am'],
      ['A4:2 C5:2 B4:2 A4:2 G4:2 A4:2 B4:2 A4:2', 'Am E'], ['G4:2 A4:2 B4:2 A4:2 G4:2 F#4:2 E4:4', 'E Am']],
    passes: [[0, 1], [0, 1], [12, 1], [0, 1], [12, 1], [0, 1]] },
  { id: 'elise', name: 'К Элизе', desc: 'Бетховен · лоу-фай', bpm: 78, style: 'lofi', color: COL.pink,
    bars: [
      ['E5:1 D#5:1 E5:1 D#5:1 E5:1 B4:1 D5:1 C5:1 A4:4 C4:1 E4:1 A4:2', 'Am'], ['B4:4 E4:1 G#4:1 B4:2 C5:4 E4:2 E5:1 D#5:1', 'E Am'],
      ['E5:1 D#5:1 E5:1 B4:1 D5:1 C5:1 A4:4 C4:1 E4:1 A4:2 B4:2', 'Am E'], ['r:1 E4:1 C5:1 B4:1 A4:8 r:4', 'Am']],
    passes: [[0, 1], [0, 1], [0, 1], [0, 1]] },
  { id: 'ode', name: 'Ода к радости', desc: 'Бетховен · стадион: топ-топ-хлоп', bpm: 104, style: 'stomp', color: COL.yellow,
    bars: [
      ['F#4:4 F#4:4 G4:4 A4:4', 'D'], ['A4:4 G4:4 F#4:4 E4:4', 'A'], ['D4:4 D4:4 E4:4 F#4:4', 'D'], ['F#4:6 E4:2 E4:8', 'A'],
      ['F#4:4 F#4:4 G4:4 A4:4', 'D'], ['A4:4 G4:4 F#4:4 E4:4', 'A'], ['D4:4 D4:4 E4:4 F#4:4', 'D'], ['E4:6 D4:2 D4:8', 'A D'],
      ['E4:4 E4:4 F#4:4 D4:4', 'A D'], ['E4:4 F#4:2 G4:2 F#4:4 D4:4', 'A D'], ['E4:4 F#4:2 G4:2 F#4:4 E4:4', 'A'], ['D4:4 E4:4 A3:8', 'D A'],
      ['F#4:4 F#4:4 G4:4 A4:4', 'D'], ['A4:4 G4:4 F#4:4 E4:4', 'A'], ['D4:4 D4:4 E4:4 F#4:4', 'D'], ['E4:6 D4:2 D4:8', 'A D']],
    passes: [[0, 1], [12, 1]] },

const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function composeClassic(song, diff) {

    const at = t0 + s * step * sc, st = song.style;

const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11] };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// Build the arrangement: per 16th step, which drums/bass/lead play; and the note chart from lead + kicks.
function compose(song, diff) {

  const deg = d => song.root + sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);

  const rhythmA = song.style === 'dnb' ? [0, 3, 6, 8, 10, 12, 14] : song.style === 'lofi' ? [0, 6, 8, 12] : [0, 2, 4, 7, 8, 10, 12, 14];
  const rhythmB = song.style === 'dnb' ? [0, 2, 4, 6, 8, 11, 12, 14] : song.style === 'lofi' ? [0, 4, 8, 10, 14] : [0, 3, 6, 8, 11, 12, 14];
  let d = 4;

  for (let b = 0; b < 2; b++) for (const s of (b ? rhythmB : rhythmA)) { d += Math.floor(r() * 5) - 2; d = Math.max(0, Math.min(9, d)); motif.push({ s: b * 16 + s, d }); }

  for (let bar = 0; bar < song.bars; bar++) {
    const chord = song.prog[bar % 4], t0 = bar * 16;
    const section = bar < intro ? 'intro' : bar >= song.bars - outro ? 'outro' : Math.floor((bar - intro) / 8) % 2 ? 'B' : 'A';
    for (let s = 0; s < 16; s++) {
      const t = (t0 + s) * step;
      // drums
      if (song.style === 'dnb') {
        if (s === 0 || s === 10) ev.push({ t, kind: 'kick' });
        if (s === 4 || s === 12) ev.push({ t, kind: 'snare' });
        if (s % 2 === 0 || (section === 'B' && s % 2)) ev.push({ t, kind: 'hat', v: s % 4 === 2 ? 0.6 : 0.3 });
      } else if (song.style === 'lofi') {
        if (s === 0 || s === 7 || s === 10) ev.push({ t, kind: 'kick' });
        if (s === 4 || s === 12) ev.push({ t, kind: 'snare' });
        if (s % 2 === 0) ev.push({ t: t + (s % 4 === 2 ? step * 0.35 : 0), kind: 'hat', v: 0.25 });
      } else {
        if (s % 4 === 0) ev.push({ t, kind: 'kick' });
        if (s === 4 || s === 12) ev.push({ t, kind: 'snare' });
        if (s % 2 === 1) ev.push({ t, kind: 'hat', v: 0.35 });
      }
      // bass on chord root
      if (section !== 'intro' || song.style === 'lofi') {
        const bassHits = song.style === 'dnb' ? [0, 3, 6, 10] : song.style === 'lofi' ? [0, 8] : [0, 2, 4, 6, 8, 10, 12, 14];

}
// Chart: lead notes become taps; easy keeps only notes on beats, hard adds snares as an extra lane.
function chartFromLeads(ev, step, diff, from, to, length) {

  const degs = leads.map(e => e.deg).sort((a, b) => a - b);

  for (const e of leads) {
    const onBeat = Math.abs(e.t / beat - Math.round(e.t / beat)) < 0.01;
    const on8 = Math.abs(e.t / (beat / 2) - Math.round(e.t / (beat / 2))) < 0.01;
    if (diff === 0 && !onBeat) continue;
    if (diff === 1 && !on8) continue;
    notes.push({ t: e.t, lane: lane(e.deg) });

  if (diff === 2) {
    for (const e of ev) if ((e.kind === 'snare' || e.kind === 'clap') && e.t > from && e.t < to) {
      const used = notes.filter(n => Math.abs(n.t - e.t) < 0.01).map(n => n.lane);
      const free = [0, 3, 1, 2].find(l => !used.includes(l));
      if (free !== undefined && used.length < 2) notes.push({ t: e.t, lane: free });

    if (n.t - last[n.lane] < step * 1.9) { const alt = [0, 1, 2, 3].sort((a, b) => Math.abs(a - n.lane) - Math.abs(b - n.lane)).find(l => n.t - last[l] >= step * 1.9 && !clean.some(c => c.lane === l && Math.abs(c.t - n.t) < 0.01)); if (alt === undefined) continue; n.lane = alt; }

}

/* ---------- audio engine with look-ahead scheduling ---------- */
let ac = null, master = null, noiseBuf = null;

}

let drive = null;
function driveNode() {
  if (drive && drive.context === ac) return drive;
  drive = ac.createWaveShaper(); const k = 30, n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
  drive.curve = curve; drive.oversample = '2x';
  const post = ac.createBiquadFilter(); post.type = 'lowpass'; post.frequency.value = 3200;
  const g = ac.createGain(); g.gain.value = 0.22;
  drive.connect(post); post.connect(g); g.connect(master);
  return drive;
}
function play(e, at, style) {
  const c = ac;
  if (e.kind === 'gtr') {
    const out = driveNode();
    for (const m of e.midis) { const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = hz(m); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.5, at + 0.005); g.gain.exponentialRampToValueAtTime(0.001, at + e.len); o.connect(g); g.connect(out); o.start(at); o.stop(at + e.len + 0.02); }
    return;
  }
  if (e.kind === 'clap') {
    for (const d of [0, 0.012, 0.024]) { const s2 = c.createBufferSource(); s2.buffer = noiseBuf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8; const g = c.createGain(); g.gain.setValueAtTime(0.7, at + d); g.gain.exponentialRampToValueAtTime(0.001, at + d + 0.12); s2.connect(f); f.connect(g); g.connect(master); s2.start(at + d, Math.random() * 0.5); s2.stop(at + d + 0.14); }
    return;
  }

  const t = state === 'play' || state === 'paused' ? now() : 0;
  // background pulses with the beat
  const beatPhase = chart && state === 'play' ? 1 - ((t / chart.beat) % 1 + 1) % 1 : 0;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0e0a20'); bg.addColorStop(1, fever ? '#3b1430' : '#1d1444');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.globalAlpha = 0.12 * beatPhase * beatPhase; ctx.fillStyle = song.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  // perspective grid lines for speed feel
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) { const y = ((i / 12 + (t * 0.5) % (1 / 12)) * H); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const lw = W / 4, hy = hitY();
  if (playMode === 'surf' && chart && (state === 'play' || state === 'paused')) drawSurf(t);
  else {
  for (let l = 0; l < 4; l++) {
    const x = l * lw;
    ctx.fillStyle = l % 2 ? 'rgba(255,255,255,.025)' : 'rgba(255,255,255,.05)'; ctx.fillRect(x, 0, lw, H);
    if (laneFlash[l] > 0) { const g = ctx.createLinearGradient(0, hy, 0, hy - H * 0.5); g.addColorStop(0, LANE_COL[l]); g.addColorStop(1, 'transparent'); ctx.globalAlpha = laneFlash[l] * 0.45; ctx.fillStyle = g; ctx.fillRect(x, hy - H * 0.5, lw, H * 0.5); ctx.globalAlpha = 1; }
  }
  // hit line + targets
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(0, hy - 2, W, 4);
  for (let l = 0; l < 4; l++) {
    const cx = (l + 0.5) * lw, r = lw * 0.32 * (1 + laneFlash[l] * 0.15);
    ctx.strokeStyle = LANE_COL[l]; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, hy, r, 0, 7); ctx.stroke();
    ctx.fillStyle = LANE_COL[l]; ctx.globalAlpha = 0.15 + laneFlash[l] * 0.6; ctx.beginPath(); ctx.arc(cx, hy, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  // notes
  if (chart && (state === 'play' || state === 'paused')) {
    const speed = hy / LEAD;
    for (const n of chart.notes) {
      const dtN = n.t - t;
      if (dtN > LEAD + 0.1) break;
      if (n.hit && n.hit !== 'miss') continue;
      if (dtN < -0.4) continue;
      const y = hy - dtN * speed, cx = (n.lane + 0.5) * lw, r = lw * 0.3;
      ctx.globalAlpha = n.hit === 'miss' ? 0.25 : 1;
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(cx, y + 5, r, 0, 7); ctx.fill();
      ctx.fillStyle = fever ? COL.orange : LANE_COL[n.lane]; ctx.beginPath(); ctx.arc(cx, y, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(cx - r * 0.3, y - r * 0.3, r * 0.3, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  }
  fx.draw(ctx);
  // HUD
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'play' || state === 'paused') {
    ctx.font = `900 22px Rubik, system-ui`; ctx.fillStyle = COL.text; ctx.fillText(scoreV.toLocaleString('ru-RU'), W / 2, 34 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0));
    if (combo >= 3) {
      const s = 1 + Math.min(0.5, laneFlash.reduce((a, b) => Math.max(a, b), 0) * 0.25);
      ctx.save(); ctx.translate(W / 2, H * 0.36); ctx.scale(s, s);
      ctx.font = `900 ${Math.round(W * 0.16)}px Rubik, system-ui`; ctx.fillStyle = fever ? COL.orange : COL.text; ctx.globalAlpha = 0.9; ctx.fillText(combo, 0, 0);
      ctx.font = `800 ${Math.round(W * 0.045)}px Rubik, system-ui`; ctx.fillText(fever ? 'ФИВЕР ×2' : 'КОМБО', 0, W * 0.11);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    if (judge) {
      const k = judge.t / 0.5;
      ctx.save(); ctx.translate(W / 2, H * 0.55); ctx.scale(1 + (1 - k) * 0.2, 1 + (1 - k) * 0.2); ctx.globalAlpha = Math.min(1, k * 2);
      ctx.font = `900 ${Math.round(W * 0.09)}px Rubik, system-ui`; ctx.fillStyle = judge.color; ctx.fillText(judge.text, 0, 0); ctx.restore(); ctx.globalAlpha = 1;
    }
    // progress
    const p = Math.max(0, Math.min(1, t / chart.length));
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, H - 6, W, 6); ctx.fillStyle = song.color; ctx.fillRect(0, H - 6, W * p, 6);
  }
  ctx.restore();
}

function finish() {
  state = 'over'; clearInterval(schedTimer); G.wake(false);
  const total = chart.notes.filter(n => !n.bad).length || 1;
  const acc = (counts.perfect + counts.great * 0.75 + counts.good * 0.4) / total;
  const grade = counts.miss === 0 && counts.good === 0 && counts.great === 0 && !counts.crash ? 'SS' : acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D';
  $('grade').textContent = grade;
  $('grade').style.color = { SS: COL.yellow, S: COL.yellow, A: COL.lime, B: COL.cyan, C: COL.pink, D: COL.red }[grade];
  $('overTitle').textContent = `${song.name} · ${playMode === 'surf' ? 'сёрф · ' : ''}${['легко', 'норм', 'жёстко'][diff]}`;
  $('res').innerHTML = (playMode === 'surf'
    ? [[scoreV.toLocaleString('ru-RU'), 'очки'], [Math.round(acc * 100) + '%', 'собрано'], [maxCombo, 'макс. комбо'], [counts.perfect, 'блоков'], [counts.miss, 'пропущено'], [counts.crash || 0, 'врезался']]
    : [[scoreV.toLocaleString('ru-RU'), 'очки'], [Math.round(acc * 100) + '%', 'точность'], [maxCombo, 'макс. комбо'], [counts.perfect, 'идеально'], [counts.great + counts.good, 'отлично / норм'], [counts.miss, 'мимо']]).map(([b, s]) => `<div><b>${b}</b><small>${s}</small></div>`).join('');
  const r = G.best(`rhythm.${song.id}.${diff}${playMode === 'surf' ? '.surf' : ''}`, scoreV);
  $('overNote').textContent = r.isNew ? 'Новый рекорд!' : `Рекорд: ${r.best.toLocaleString('ru-RU')}`;
  $('over').hidden = false;
  if (grade.startsWith('S') || r.isNew) { G.sfx('win'); fx.emit(W / 2, H * 0.2, { n: 90, color: [COL.yellow, COL.pink, COL.cyan, COL.lime], speed: 700, life: 1.5, size: 7, gravity: 500, shape: 'rect' }); }
  setTimeout(stopSong, 600);
  renderSongs();
}

/* ---------- menu ---------- */
const escH = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderSongs() {
  $('songs').innerHTML = allSongs().map(s => {
    const best = G.get(`best.rhythm.${s.id}.${diff}${playMode === 'surf' ? '.surf' : ''}`, null);
    const del = s.custom ? `<button type="button" class="del" data-del="${s.trackId}" aria-label="Удалить трек">×</button>` : '';
    return `<div style="position:relative"><button type="button" class="song" data-song="${s.id}" style="--c:${s.color}" aria-pressed="${s === song}"><b style="color:${s.color}">${escH(s.name)}</b><small>${s.desc}${s.passes ? '' : ' · ' + s.bpm + ' BPM'}</small><span>${best != null ? 'рекорд<br>' + best.toLocaleString('ru-RU') : 'новое'}</span></button>${del}</div>`;
  }).join('');
}
$('songs').addEventListener('click', async e => {
  const d = e.target.closest('[data-del]');
  if (d) {
    const id = +d.dataset.del;
    if (d.dataset.armed) { await DB.del(id).catch(() => {}); decoded.delete(id); if (song.trackId === id) song = SONGS[0]; await loadUserTracks(); G.toast('Трек удалён'); }
    else { d.dataset.armed = '1'; d.textContent = '?'; d.setAttribute('aria-label', 'Нажми ещё раз, чтобы удалить'); G.toast('Нажми ещё раз, чтобы удалить'); setTimeout(() => { if (d.isConnected) { delete d.dataset.armed; d.textContent = '×'; } }, 2500); }
    return;
  }
  const b = e.target.closest('[data-song]'); if (!b) return;
  song = allSongs().find(s => s.id === b.dataset.song) || SONGS[0]; G.set('rhythm.songId', song.id); G.sfx('tap'); renderSongs();
});
const PLAY_HINT = { notes: 'Жми на дорожку, когда нота долетает до линии.', surf: 'Лети по трассе: тап слева или справа меняет полосу. Собирай цветные блоки, объезжай серые.' };
function syncPlay() { document.querySelectorAll('[data-play]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.play === playMode))); $('playHint').textContent = PLAY_HINT[playMode]; }
document.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => { playMode = b.dataset.play; G.set('rhythm.play', playMode); G.sfx('tap'); syncPlay(); renderSongs(); }));
function syncDiff() { document.querySelectorAll('[data-diff]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.diff === diff))); }
document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => { diff = +b.dataset.diff; G.set('rhythm.diff', diff); G.sfx('tap'); syncDiff(); renderSongs(); }));
const lat = $('lat');
const showLat = () => { $('latOut').textContent = (latency > 0 ? '+' : '') + latency + ' мс'; };
lat.value = latency; showLat();
lat.addEventListener('input', () => { latency = +lat.value; G.set('rhythm.lat', latency); showLat(); });
$('start').addEventListener('click', startSong);
$('again').addEventListener('click', startSong);
$('overMenu').addEventListener('click', () => { $('over').hidden = true; $('menu').hidden = false; state = 'menu'; });
$('restart').addEventListener('click', () => { stopSong(); setTimeout(startSong, 300); });
$('quit').addEventListener('click', () => { stopSong(); $('pause').hidden = true; $('menu').hidden = false; state = 'menu'; renderSongs(); });
const pause = () => { if (state !== 'play') return; state = 'paused'; clearInterval(schedTimer); ac && ac.suspend(); $('pause').hidden = false; };
G.topbar({ pause });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
layout(); syncPlay(); renderSongs(); syncDiff(); loadUserTracks();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140f24">
<title>Башня — Игротека</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<style>
  html, body { overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: fixed; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top)); z-index: 5;
    display: grid; justify-items: center; pointer-events: none;
  }
  .hud b { font-size: 72px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .hud small { font-size: 15px; font-weight: 800; color: var(--muted); min-height: 1.3em; }
  .hud b.bump { animation: bump 220ms var(--ease); }
  @keyframes bump { 40% { transform: scale(1.18); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" hidden><b id="score">0</b><small id="who"></small></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Башня</h1>
    <p>Блок ездит туда-сюда — тапни, чтобы уронить. Всё, что свесилось, отрежется. Положишь точно — блок не уменьшится, а серия точных его даже нарастит.</p>
    <div class="seg" role="group" aria-label="Игроки">
      <button type="button" data-n="1" aria-pressed="true">Один</button>
      <button type="button" data-n="2" aria-pressed="false">Вдвоём</button>
    </div>
    <p id="nHint" hidden>Строите одну башню по очереди. Кто её уронит — проиграл.</p>
    <button class="btn" type="button" id="start">Играть</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1 id="overTitle">Упала!</h1>
    <div class="big" id="overScore"></div>
    <p id="overNote"></p>
    <div class="choices">
      <button class="btn" type="button" id="again">Ещё раз</button>
      <button class="btn ghost" type="button" id="overMenu">Меню</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c');
let W, H, ctx;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { pink: css('--pink'), cyan: css('--cyan'), yellow: css('--yellow'), lime: css('--lime') };
const PCOL = [COL.pink, COL.cyan];

let nPlayers = G.get('tower.n', 1), turn = 0;
let state = 'menu', stack = [], cur = null, chunks = [], rings = [], combo = 0, cam = 0, zoom = 1, overT = 0;
let BW, BH, BASE;                               // base block width, slab height, ground line
const fx = new G.Particles(), shake = new G.Shake();

function layout() {
  ({ w: W, h: H, ctx } = G.fit(canvas));
  BW = Math.min(W * 0.62, 340); BH = Math.max(26, Math.min(H * 0.042, 40)); BASE = H * 0.86;
}
addEventListener('resize', layout);

// Each level gets its own hue, so the tower reads as a rainbow you built.
const hueOf = i => (285 + i * 9) % 360;
const fill = (i, l) => `hsl(${hueOf(i)} 85% ${l}%)`;

/* ---------- game ---------- */
function startGame() {
  stack = [{ x: (W - BW) / 2, w: BW }]; chunks = []; rings = []; combo = 0; cam = 0; zoom = 1; turn = 0;
  ['menu', 'over'].forEach(id => { $(id).hidden = true; });
  $('hud').hidden = false; $('score').textContent = 0;
  state = 'play'; G.wake(true); spawn(); whoLabel();
}
function spawn() {
  const top = stack[stack.length - 1], lvl = stack.length;
  const fromLeft = lvl % 2 === 1;
  // speed grows with height, then levels off so it stays humanly playable
  const speed = W * Math.min(1.35, 0.5 + lvl * 0.022);
  cur = { x: fromLeft ? top.x - top.w * 1.25 : top.x + top.w * 1.25, w: top.w, dir: fromLeft ? 1 : -1, speed };
}
function whoLabel() {
  const el = $('who');
  if (nPlayers === 1) { el.textContent = combo >= 2 ? `точно ×${combo}` : ''; el.style.color = ''; return; }
  el.textContent = `ход: игрок ${turn + 1}`; el.style.color = PCOL[turn];
}
function drop() {
  if (state !== 'play' || !cur) return;
  const top = stack[stack.length - 1], lvl = stack.length;
  const y = BASE - lvl * BH;
  const d = cur.x - top.x, tol = Math.max(3, W * 0.012);
  if (Math.abs(d) <= tol) {                      // perfect: snap onto the block below
    combo++;
    let w = top.w;
    if (combo >= 3) w = Math.min(BW, w + W * 0.025);   // a run of perfects wins width back
    const x = top.x - (w - top.w) / 2;
    stack.push({ x, w });
    rings.push({ x, w, y, t: 0 });
    G.sfx('note', combo - 1); G.buzz(combo >= 3 ? [12, 30, 12] : 14); shake.add(2);
    fx.emit(x + w / 2, y, { n: 18, color: ['#fff', fill(lvl, 70)], speed: 320, life: 0.5, size: 4, gravity: 200, spread: Math.PI, angle: -Math.PI / 2, shape: 'rect' });
  } else {
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const keep = right - left;
    if (keep < 2) return topple();
    combo = 0;
    // the overhang falls off and tumbles away
    const cutX = d > 0 ? right : cur.x, cutW = cur.w - keep;
    chunks.push({ x: cutX, y, w: cutW, h: BH, vx: (d > 0 ? 1 : -1) * W * 0.12, vy: -H * 0.05, rot: 0, vr: (d > 0 ? 1 : -1) * (2 + Math.random() * 2), lvl });
    stack.push({ x: left, w: keep });
    G.sfx('slice'); G.buzz(10); shake.add(4);
  }
  cur = null;
  $('score').textContent = stack.length - 1;
  const s = $('score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
  if (nPlayers === 2) turn = 1 - turn;
  whoLabel();
  spawn();
}
function topple() {
  const lvl = stack.length;
  chunks.push({ x: cur.x, y: BASE - lvl * BH, w: cur.w, h: BH, vx: cur.dir * W * 0.2, vy: -H * 0.08, rot: 0, vr: cur.dir * 4, lvl });
  cur = null; state = 'fall'; overT = 0; G.wake(false);
  G.sfx('boom'); G.buzz([40, 30, 90]); shake.add(18);
}
function showOver() {
  state = 'over';
  const h = stack.length - 1;
  if (nPlayers === 2) {
    $('overTitle').textContent = `Победил игрок ${2 - turn}`;
    $('overTitle').style.color = PCOL[1 - turn];
    $('overScore').textContent = h;
    $('overNote').textContent = `Игрок ${turn + 1} уронил башню на высоте ${h}.`;
    G.sfx('win');
  } else {
    $('overTitle').textContent = 'Упала!'; $('overTitle').style.color = '';
    $('overScore').textContent = h;
    const r = G.best('tower', h);
    $('overNote').textContent = r.isNew ? 'Новый рекорд!' : `Рекорд: ${r.best}`;
    if (r.isNew) { G.sfx('win'); fx.emit(W / 2, H * 0.3, { n: 80, color: [COL.yellow, COL.pink, COL.cyan, COL.lime], speed: 700, life: 1.4, size: 7, gravity: 500, shape: 'rect' }); }
  }
  $('over').hidden = false;
}

/* ---------- input ---------- */
canvas.addEventListener('pointerdown', e => { if (e.isPrimary) drop(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); drop(); } });

/* ---------- loop ---------- */
G.loop(dt => {
  if (cur) {
    const top = stack[stack.length - 1];
    cur.x += cur.dir * cur.speed * dt;
    const lo = top.x - cur.w * 1.25, hi = top.x + top.w * 1.25;   // swing fully clear of the tower: a late tap misses
    if (cur.x > hi) { cur.x = hi; cur.dir = -1; }
    if (cur.x < lo) { cur.x = lo; cur.dir = 1; }
  }
  // camera keeps the working level at ~40% of the screen; after a fall it zooms out to show the whole tower
  const n = stack.length;
  if (state === 'fall' || state === 'over') {
    const towerH = n * BH + BH * 2;
    const zt = Math.min(1, (BASE - H * 0.2) / towerH);
    zoom += (zt - zoom) * Math.min(1, dt * 3); cam += (0 - cam) * Math.min(1, dt * 3);
    if (state === 'fall') { overT += dt; if (overT > 1.1) showOver(); }
  } else {
    const want = Math.max(0, H * 0.42 - (BASE - n * BH));
    cam += (want - cam) * Math.min(1, dt * 6);
  }
  for (const c of chunks) { c.vy += H * 2.4 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; }
  chunks = chunks.filter(c => c.y < H * 3);
  rings.forEach(r => { r.t += dt; }); rings = rings.filter(r => r.t < 0.5);
  fx.update(dt); shake.update(dt);
  draw();
});

/* ---------- render ---------- */
function paintSky(ctx, band) {
  const g = ctx.createLinearGradient(0, 0, 0, H), h = (285 + band * 40) % 360;
  g.addColorStop(0, `hsl(${h} 45% 10%)`); g.addColorStop(1, `hsl(${(h + 30) % 360} 50% 20%)`);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 40; i++) { const x = (i * 97.3) % W, y = (i * 53.7) % (H * 0.7); ctx.fillRect(x, y, 2, 2); }
}
function slab(x, y, w, i, alpha = 1) {
  const top = BH * 0.32;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = fill(i, 52); ctx.fillRect(x, y, w, BH);                        // front
  ctx.fillStyle = fill(i, 68);                                                   // top face
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + top, y - top); ctx.lineTo(x + w + top, y - top); ctx.lineTo(x + w, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = fill(i, 38);                                                   // right side
  ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w + top, y - top); ctx.lineTo(x + w + top, y + BH - top); ctx.lineTo(x + w, y + BH); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function draw() {
  const band = Math.floor((stack.length - 1) / 10);
  G.blit(ctx, G.layer('sky' + band, W, H, x => paintSky(x, band)), W, H);
  ctx.save(); ctx.translate(shake.x, shake.y);
  // zoom around the ground centre, then scroll
  ctx.translate(W / 2, BASE); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -BASE + cam);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-W, BASE + BH, W * 3, H * 4);          // ground
  // only the levels on screen are drawn, from the bottom up so top faces overlap correctly
  const first = zoom < 1 ? 0 : Math.max(0, Math.floor((BASE + cam - H) / BH) - 1);
  for (let i = first; i < stack.length; i++) { const b = stack[i]; slab(b.x, BASE - i * BH, b.w, i); }
  if (cur) slab(cur.x, BASE - stack.length * BH, cur.w, stack.length);
  for (const c of chunks) {
    ctx.save(); ctx.translate(c.x + c.w / 2, c.y + c.h / 2); ctx.rotate(c.rot);
    ctx.fillStyle = fill(c.lvl, 52); ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
  }
  for (const r of rings) {                                                       // perfect-drop shockwave
    const k = r.t / 0.5, pad = 6 + k * 26;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.strokeRect(r.x - pad, r.y - pad * 0.6 - BH * 0.3, r.w + pad * 2, BH + pad * 1.2); ctx.globalAlpha = 1;
  }
  fx.draw(ctx);
  ctx.restore();
}

/* ---------- menus ---------- */
function syncMenu() { document.querySelectorAll('[data-n]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === nPlayers))); $('nHint').hidden = nPlayers === 1; }
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => { nPlayers = +b.dataset.n; G.set('tower.n', nPlayers); G.sfx('tap'); syncMenu(); }));
$('start').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('overMenu').addEventListener('click', () => { $('over').hidden = true; $('hud').hidden = true; $('menu').hidden = false; state = 'menu'; stack = [{ x: (W - BW) / 2, w: BW }]; zoom = 1; cam = 0; });
G.topbar();
layout(); syncMenu();
stack = [{ x: (W - BW) / 2, w: BW }];
window.__tower = { get stack() { return stack; }, get cur() { return cur; }, get state() { return state; }, drop };   // for automated checks
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140f24">
<title>Прыг-скок — Игротека</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<style>
  html, body { overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; display: block; }
  .hud {
    position: fixed; left: 72px; right: 128px; top: max(8px, env(safe-area-inset-top)); height: 48px; z-index: 11; pointer-events: none;
    display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,.45); white-space: nowrap; overflow: hidden;
  }
  .hud span { display: inline-flex; align-items: center; gap: 6px; }
  .coin-i { width: 15px; height: 15px; border-radius: 50%; background: var(--yellow); box-shadow: inset -3px -2px 0 oklch(0.7 0.16 80); }
  .shield-i { width: 15px; height: 15px; border-radius: 50%; border: 3px solid var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  /* controls: a Game Boy style pad under the game in portrait, translucent corners in landscape */
  .pad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); background: var(--ink-2); border-top: 3px solid var(--ink-3);
  }
  .pad.float { background: transparent; border: 0; pointer-events: none; }
  .pad.float > * { pointer-events: auto; opacity: 0.42; }
  .pad.float .dpad { width: min(30vw, 200px); height: min(16vw, 84px); }
  .pad.float .jumpbtn { width: min(16vw, 96px); }
  .dpad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(52vw, 230px); height: min(26vw, 110px); touch-action: none; }
  .dpad span, .jumpbtn {
    display: grid; place-items: center; border-radius: 22px; background: var(--ink-3); color: var(--text);
    box-shadow: 0 5px 0 oklch(0.12 0.04 290); font-size: 34px; font-weight: 900; transition: transform 60ms, box-shadow 60ms;
  }
  .dpad span.on, .jumpbtn.on { transform: translateY(4px); box-shadow: 0 1px 0 oklch(0.12 0.04 290); background: var(--line); }
  .jumpbtn { width: min(30vw, 124px); aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--pink); color: white; box-shadow: 0 6px 0 color-mix(in oklch, var(--pink) 50%, black); touch-action: none; }
  .jumpbtn.on { background: color-mix(in oklch, var(--pink) 80%, black); box-shadow: 0 1px 0 color-mix(in oklch, var(--pink) 50%, black); }
  .levels { display: grid; gap: 10px; }
  .lvl {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 16px;
    background: var(--ink-2); color: var(--text); text-align: left; font-weight: 800; font-size: 17px;
  }
  .lvl b { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--pink); color: white; font-size: 20px; }
  .lvl .st { color: var(--yellow); letter-spacing: 2px; font-size: 18px; }
  .lvl:disabled { opacity: 0.45; }
  .lvl:disabled b { background: var(--ink-3); }
  .stars { font-size: 46px; letter-spacing: 6px; color: var(--yellow); line-height: 1; }
  .stars i { font-style: normal; color: var(--ink-3); }
  .stats { display: grid; gap: 4px; color: var(--muted); font-weight: 700; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" hidden><span id="lvlName"></span><span><i class="coin-i"></i><b id="coins">0</b></span><span id="shield" hidden><i class="shield-i"></i></span></div>
<div class="pad" id="pad" hidden>
  <div class="dpad" id="dpad"><span data-d="-1" aria-label="Влево">◀</span><span data-d="1" aria-label="Вправо">▶</span></div>
  <button class="jumpbtn" type="button" id="jumpBtn" aria-label="Прыжок">▲</button>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Прыг-скок</h1>
    <p>Беги вправо до флага. Прыгай на врагов сверху, бей блоки головой — там монетки и щит. Чем дольше держишь прыжок, тем выше. Колючих не трогай!</p>
    <div class="levels" id="levels"></div>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="panel">
    <h1>Пауза</h1>
    <div class="choices">
      <button class="btn" type="button" id="resume">Продолжить</button>
      <button class="btn ghost" type="button" id="restart">Начать уровень заново</button>
      <button class="btn ghost" type="button" id="toLevels">Уровни</button>
    </div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1 id="overTitle">Уровень пройден!</h1>
    <div class="stars" id="stars"></div>
    <div class="stats" id="stats"></div>
    <div class="choices">
      <button class="btn" type="button" id="next">Дальше</button>
      <button class="btn ghost" type="button" id="again">Ещё раз</button>
      <button class="btn ghost" type="button" id="overLevels">Уровни</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
(() => {
'use strict';
/* Levels are generated and checked for reachability by tools/levels.py — edit them there. */
/*LEVELS*/const LEVELS = [{"name": "Зелёный луг","theme": "meadow","map": ["","","","","              ?","","                                                                                                                      ooo","                                                 oooo","       ooo  ?BPB?                                ====       ???                  oooo       B?B                    XXX   X","                                         ooo                                                                      XXXX   XX","                               X                                             X                  ooooo            XXXXX   XXX","  S                  E       EXX                        E       C     E   E  X                      E  E        XXXXXX   XXXX         F","#########################################   #####################################    #################################################################","#########################################   #####################################    #################################################################"]},{"name": "Холмы","theme": "hills","map": ["","","","                                                     o                                                                                          oo  oo","                                                                                                                                                  o","                                                   ?=?                                                                       ooo","","                            oooo                                                                      ooooo                 #######","              P                                                          oooooo                 ?B?B?  ===                  #######                      X####","                                 E      E                                                                         #######   #######                     XX####","        oooo              #####################                                                                   #######   #######                    XXX####","  S               H       #####################      J                 M            C     H        E    ^^^       #######   #######      E  E  H  J   XXXX####  F","#######################   #####################   #############   #####          ##############################   #######   #######   #########################################","#######################   #####################   #############   #####          ##############################   #######   #######   #########################################"]},{"name": "Пещера","theme": "cave","map": ["##########################################################################################################################################################################","##########################################################################################################################################################################","                         #","                         #","                         #                                                              Z                                                 Z","                         #                          Z               ooo                             ?B?","                      Z  #                                                                                                             ooo","                         #               oooo                              C      K            E                                       ===","          ?P?            #              BBBBBB                           ######################################","                                                                         ######################################                  ===         ===             X","                          ooo                                            ######################################                                             XX","  S             E                      K          E   E                  #####################################^^^^ E   K                              E    XXX    F","###############################   ###########################   ###      #####################################################                    ########################","###############################   ###########################   ###V     #####################################################                    ########################"]},{"name": "Облака","theme": "clouds","map": ["","","","                                             Z                                       o                            Z","                                                                                          oooEo","                                                       ?B?                               ########","                                          oooo                                           ########             ===               ?B?B","                              E           ====               ooooo                       ########                                      oooo       H","        ?P?       ooo       ######                  H                   C    E           ########        ===       ===      K                  ########                X###","                            ######  ====         ##########M         ############        ########                       #############M         ########               XX###","                  #######   ######               ##########          ############    J   ########   #####               #############          ########              XXX###","  S               #######   ######               ##########          ############   ###  ########   #####               #############          ########      E  E   XXXX###     F","###############   #######   ######               ##########          ############   ###  ########   #####               #############          ########   ###############################","###############   #######   ######               ##########          ############   ###  ########   #####               #############          ########   ###############################"]},{"name": "Закат","theme": "sunset","map": ["","","","                                                                                                                                         o","","                                                 oooo","                                                 #####                              oooo           oooo               ===   Z","                                                 #####                                                                                                      X####X","         ?P?         oooooo                      #####                B?B?B                                                                                XX####XX","                                                 #####                           M              M             H     ^^   E                                XXX####XXX","                                                 #####                                                    #########################                      XXXX####XXXX","  S                M                H   H    J   #####      E   K       C                                 #########################      J  K     H     XXXXX####XXXXX        F","###################           ################   #####    #######################          #####          #########################   ###################################################","###################           ################   #####    #######################          #####          #########################   ###################################################"]},{"name": "Ночной лес","theme": "night","map": ["","","","                                                                                                o","                                              ?                 Z","                                                                                                   ooKoo","                                                              ooooo                                #####                                             Z","                                 oooo                                                              #####","         ?P?                     ====       B?B?B             #####                                #####                 ooooo              ???                X####X","                                                              #####                                #####                                                      XX####XX","                                                      #####   #####   #####                        #####                                                     XXX####XXX","  S                 E           ^^^^    K    H        #####   #####   #####     C     E  E  H   J  #####  ^^^          M            H   K      E  H     ^^  XXXX####XXXX            F","#########################   #######################   #####   #####   #####   #################################   #####          #############################################################","#########################   #######################   #####   #####   #####   #################################   #####          #############################################################"]},{"name": "Шахта","theme": "mine","map": ["#########################################################################################################################################################################################","#########################################################################################################################################################################################","                                               Z    X                                                           Z","                                                    X","                                                                   oo                        oo     K     E         H","                                    E     K                       BBBB                           ########################","                              oo ####################                                   oo       ########################","                                 ####################                                            ########################                                  ooooo","        ?P?                      ####################     C    E        ^^   H                   ########################   #####                     B?B?B=====         XXX","                                 ####################   #########################                ########################   #####                                       XXXXX","                                 ####################   #########################                ########################   #####   #####                              XXXXXXX","  S           E    K             ####################   #########################   ###          ########################   #####   #####      E   K        ^^^  H    XXXXXXXXX     F","#######################   ###    ####################   #########################   ###          ########################   #####   #####   #############################################","#######################   ###V   ####################   #########################   ###V    V    ########################   #####   #####   #############################################"]},{"name": "Лавовый замок","theme": "castle","map": ["XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX","","","","","","                                                                                                  Z                   ooo                                             oo","                                                                                                                      ===                  Z","          ?P?                 Z               ==              B?B         oooooo                                           ==                                        XXXX","                                          ==                                            E    ^^        K  E     V                                       ===         XXXXXX","                                                                                     XXXXXXXXXXXXXXXXXXXXXXXXXX                                                    XXXXXXXX","  S             K                 E                  K    C       H     M            XXXXXXXXXXXXXXXXXXXXXXXXXX                   H    K        E                 XXXXXXXXXX        F","XXXXXXXXXXXXXXXXXXXXXLLLLXXXXXXXXXXXXXXXXLLLLLLLLLXXXXXXXXXXXXXXXXXXXXXLLLLLLLLLLLLLLXXXXXXXXXXXXXXXXXXXXXXXXXXLLLLLLLLLLLLLLLLXXXXXXXXXXXXXXXXXXXXXXXXLLLLLLXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX","XXXXXXXXXXXXXXXXXXXXXLLLLXXXXXXXXXXXXXXXXLLLLLLLLLXXXXXXXXXXXXXXXXXXXXXLLLLLLLLLLLLLLXXXXXXXXXXXXXXXXXXXXXXXXXXLLLLLLLLLLLLLLLLXXXXXXXXXXXXXXXXXXXXXXXXLLLLLLXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"]}];/*END LEVELS*/

const $ = id => document.getElementById(id);
const canvas = $('c');
let W, H, GH, ctx, TS, viewW;                          // GH: height of the game area above the pad
const ROWS = 14;
const SOLID = new Set(['#', 'X', 'B', '?', 'P', 'U', 'J']);

// Movement tuned for a phone: forgiving jump timing (coyote time, input buffer), held jump goes higher.
const PH = { g: 55, jump: 22, spring: 31, stomp: 13, stompHeld: 19, maxV: 7, acc: 60, air: 38, fric: 50, fall: 22 };
const STEP = 1 / 120;

const THEMES = {
  meadow: { sky: ['#5fb6ff', '#bfe8ff'], far: '#7cc96a', near: '#4fae55', dirt: '#8a5a32', dirt2: '#6f4526', top: '#5ccf4a', stone: '#9a8f87' },
  hills:  { sky: ['#ffb36b', '#ffe3a6'], far: '#d38a5a', near: '#9fbf4a', dirt: '#8f5b34', dirt2: '#71442a', top: '#9ad64a', stone: '#a1928a' },
  cave:   { sky: ['#140f24', '#2a1d4a'], far: '#231a3d', near: '#2f2452', dirt: '#4a3d6e', dirt2: '#3a2f58', top: '#7a6ab8', stone: '#5c5480' },
  sunset: { sky: ['#3a1d6e', '#ff7a6b'], far: '#5a2d7a', near: '#3d1f5e', dirt: '#3f2550', dirt2: '#2e1a3d', top: '#ff9a4a', stone: '#6a5378' },
  clouds: { sky: ['#5fb0ff', '#cfeaff'], far: '#9fd0ff', near: '#dff1ff', dirt: '#f2f7ff', dirt2: '#c9daf2', top: '#ffffff', stone: '#b9c9e0' },
  night:  { sky: ['#070b24', '#1f2a5e'], far: '#16204a', near: '#1b2a3a', dirt: '#3b2e4a', dirt2: '#2c2238', top: '#3fae7a', stone: '#5a5a78' },
  mine:   { sky: ['#1a120c', '#3a2618'], far: '#2a1c12', near: '#3a2818', dirt: '#6b4a2e', dirt2: '#553a22', top: '#a0763e', stone: '#7a6a5a' },
  castle: { sky: ['#1a0b14', '#3d1422'], far: '#2a1020', near: '#3a1426', dirt: '#5a4a52', dirt2: '#463840', top: '#7a6870', stone: '#6e6068' },
};

let state = 'menu', li = 0, lv = null, grid = null, theme = null;
let hero, enemies, plats, berries, bumps, pops, flag, checkpoints, cp, coins, coinTotal, deaths, tStart, time, camX = 0, winT = 0, deadT = 0;
const input = { dir: 0, jump: false, jumpAt: -1 };
const fx = new G.Particles(), shake = new G.Shake();
let stars = G.get('jump.stars', []);

/* ---------- layout ---------- */
function layout() {
  W = innerWidth; H = innerHeight;
  const portrait = H > W * 1.15;
  const pad = $('pad');
  pad.classList.toggle('float', !portrait);
  const padH = portrait ? Math.min(250, Math.max(170, H * 0.26)) : 0;
  pad.style.height = portrait ? padH + 'px' : '';
  GH = H - padH;
  canvas.style.height = GH + 'px';
  ({ ctx } = G.fit(canvas));
  TS = GH / ROWS; viewW = W / TS;
}
addEventListener('resize', layout);

/* ---------- level setup ---------- */
function load(i, fromCp) {
  li = i; lv = LEVELS[i]; theme = THEMES[lv.theme];
  const width = Math.max(...lv.map.map(r => r.length));
  // entities always come from the original map; after a death the blocks and coins come from the checkpoint snapshot
  grid = lv.map.map(r => (r + ' '.repeat(width)).slice(0, width).split(''));
  enemies = []; plats = []; berries = []; bumps = new Map(); pops = []; checkpoints = [];
  let start = { x: 2, y: 11 };
  coinTotal = 0;
  lv.map.forEach(r => { for (const ch of r) if (ch === 'o' || ch === '?') coinTotal++; });
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < width; x++) {
    const ch = grid[y][x];
    if ('EKHZ'.includes(ch)) { enemies.push(makeEnemy(ch, x, y)); grid[y][x] = ' '; }
    else if (ch === 'M' || ch === 'V') { plats.push({ type: ch, x0: x, y0: y + 0.6, x, y: y + 0.6, w: 3, t: 0, dx: 0, dy: 0 }); grid[y][x] = ' '; }
    else if (ch === 'S') { start = { x, y }; grid[y][x] = ' '; }
    else if (ch === 'C') { checkpoints.push({ x, y, on: !!(cp && fromCp && cp.x === x) }); grid[y][x] = ' '; }
    else if (ch === 'F') { flag = { x, y, raise: 0 }; grid[y][x] = ' '; }
  }
  if (fromCp && cp) grid = cp.grid.map(r => r.slice());
  // after a death, enemies behind the checkpoint stay gone: you already got past them
  if (fromCp && cp) enemies = enemies.filter(e => e.x > cp.x + 2);
  const sp = fromCp && cp ? { x: cp.x, y: cp.y } : start;
  hero = { x: sp.x + 0.15, y: sp.y + 0.1, w: 0.7, h: 0.9, vx: 0, vy: 0, face: 1, ground: false, lastGround: 0, shield: false, inv: 0, sq: 0, plat: null, t: 0 };
  coins = fromCp && cp ? cp.coins : 0;
  camX = Math.max(0, hero.x - viewW * 0.4);
  $('coins').textContent = coins; $('lvlName').textContent = `Ур. ${i + 1}`; $('shield').hidden = true;
}
function makeEnemy(type, x, y) {
  const e = { type, x: x + 0.1, y: y + 0.2, w: 0.8, h: 0.8, vx: -1, vy: 0, dir: -1, alive: true, dead: 0, t: Math.random() * 3, x0: x, y0: y, ground: false, hop: 1 + Math.random() };
  if (type === 'Z') { e.h = 0.6; e.y = y + 0.2; }
  return e;
}
function startLevel(i) {
  cp = null; deaths = 0; time = 0;
  ['menu', 'over', 'pause'].forEach(id => { $(id).hidden = true; });
  $('hud').hidden = false; $('pad').hidden = false;
  layout(); load(i, false);
  state = 'play'; G.wake(true); G.sfx('whistle');
}

/* ---------- tiles ---------- */
const tileAt = (x, y) => (x < 0 || x >= grid[0].length) ? '#' : (y < 0 || y >= ROWS) ? ' ' : grid[y][x];
const solid = (x, y) => SOLID.has(tileAt(x, y));
const EPS = 1e-4;

// Move a body along one axis and stop it at solid tiles. Returns the tile that stopped it.
function moveX(b, dx) {
  b.x += dx;
  const y0 = Math.floor(b.y + EPS), y1 = Math.floor(b.y + b.h - EPS);
  if (dx > 0) { const tx = Math.floor(b.x + b.w - EPS); for (let y = y0; y <= y1; y++) if (solid(tx, y)) { b.x = tx - b.w; b.vx = 0; return { x: tx, y }; } }
  if (dx < 0) { const tx = Math.floor(b.x + EPS); for (let y = y0; y <= y1; y++) if (solid(tx, y)) { b.x = tx + 1; b.vx = 0; return { x: tx, y }; } }
  return null;
}
function moveY(b, dy, oneWay, nudge) {
  const prevBottom = b.y + b.h;
  b.y += dy;
  const x0 = Math.floor(b.x + EPS), x1 = Math.floor(b.x + b.w - EPS);
  if (dy > 0) {
    const ty = Math.floor(b.y + b.h - EPS);
    for (let x = x0; x <= x1; x++) {
      const ch = tileAt(x, ty);
      if (SOLID.has(ch) || (oneWay && ch === '=' && prevBottom <= ty + 0.02)) { b.y = ty - b.h; b.vy = 0; return { x, y: ty, ch }; }
    }
  }
  if (dy < 0) {
    const ty = Math.floor(b.y + EPS);
    // when the head touches two blocks, the one nearer the centre is the one you hit
    const cx = b.x + b.w / 2, xs = [x0, x1].sort((a, c) => Math.abs(a + 0.5 - cx) - Math.abs(c + 0.5 - cx));
    for (const x of xs) if (solid(x, ty)) {
      // clipped a corner by a few pixels: slide past it instead of bonking (feels much fairer)
      if (nudge && x0 !== x1) {
        const over = x === x0 ? x0 + 1 - b.x : b.x + b.w - x1;
        const other = x === x0 ? x1 : x0;
        if (over < 0.3 && !solid(other, ty) && !solid(other, ty + 1)) { b.x += x === x0 ? over + EPS : -over - EPS; continue; }
      }
      b.y = ty + 1; b.vy = 0; return { x, y: ty, ch: tileAt(x, ty) };
    }
  }
  return null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- hero ---------- */
function stepHero(dt) {
  const h = hero;
  h.t += dt; h.inv = Math.max(0, h.inv - dt); h.sq *= Math.pow(0.002, dt);
  // horizontal
  const want = input.dir * PH.maxV;
  const acc = h.ground ? (input.dir ? PH.acc : PH.fric) : PH.air;
  if (h.vx < want) h.vx = Math.min(want, h.vx + acc * dt); else if (h.vx > want) h.vx = Math.max(want, h.vx - acc * dt);
  if (input.dir) h.face = input.dir;
  // jump: buffered press + coyote time
  if (h.ground) h.lastGround = h.t;
  const buffered = input.jumpAt >= 0 && h.t - input.jumpAt < 0.13;
  if (buffered && h.t - h.lastGround < 0.1) {
    h.vy = -PH.jump; h.ground = false; h.lastGround = -1; h.plat = null; input.jumpAt = -1; h.sq = -0.6;
    G.sfx('flip', 3); dust(h.x + h.w / 2, h.y + h.h, 6);
  }
  // gravity: lighter while rising with the button held, heavier when falling — snappy and controllable
  const g = h.vy < 0 ? (input.jump ? PH.g : PH.g * 2.6) : PH.g * 1.25;
  h.vy = Math.min(PH.fall, h.vy + g * dt);
  // carried by a moving platform
  if (h.plat) { moveX(h, h.plat.dx); h.y = h.plat.y - h.h; }
  const hx = moveX(h, h.vx * dt);
  const wasGround = h.ground; h.ground = false;
  const prevBottom = h.y + h.h;
  const hy = moveY(h, h.vy * dt, true, true);
  if (hy && hy.y >= h.y + h.h - 0.01) {               // landed on a tile
    h.ground = true; h.plat = null;
    if (hy.ch === 'J') { h.vy = -PH.spring; h.ground = false; bump(hy.x, hy.y, 'spring'); G.sfx('mult', 6); G.buzz(15); h.sq = -0.8; }
    else if (!wasGround) { h.sq = 0.7; dust(h.x + h.w / 2, h.y + h.h, 4); }
  } else if (hy) headHit(hy.x, hy.y);
  // moving platforms are one-way from above
  // compare with where the platform was a step ago, or one rising into a falling hero lets him through
  if (!h.ground && h.vy >= 0) for (const p of plats) {
    if (h.x + h.w > p.x && h.x < p.x + p.w && prevBottom <= p.y + 0.08 + Math.abs(p.dy) && h.y + h.h >= p.y) {
      h.y = p.y - h.h; h.vy = 0; h.ground = true; if (!h.plat && !wasGround) h.sq = 0.5; h.plat = p; break;
    }
  }
  if (!h.ground) h.plat = null;
  if (h.plat && (h.x + h.w < h.plat.x || h.x > h.plat.x + h.plat.w)) h.plat = null;
  // coins, spikes, lava
  const x0 = Math.floor(h.x), x1 = Math.floor(h.x + h.w - EPS), y0 = Math.floor(h.y), y1 = Math.floor(h.y + h.h - EPS);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const ch = tileAt(x, y);
    if (ch === 'o') { grid[y][x] = ' '; getCoin(x + 0.5, y + 0.5); }
    else if (ch === '^' && h.y + h.h > y + 0.45) { hurt(); h.vy = -12; }
    else if (ch === 'L' && h.y + h.h > y + 0.35) return die();
  }
  if (h.y > ROWS + 1) return die();
  // flag

    [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(s * w * 0.2, -h * 0.5); ctx.lineTo(s * w * 0.95, -h * (0.9 + flap * 0.6)); ctx.lineTo(s * w * 0.7, -h * 0.35); ctx.lineTo(s * w * 0.45, -h * 0.5); ctx.fill(); });
    ctx.fillStyle = '#5a3f8e'; ctx.beginPath(); ctx.arc(0, -h * 0.5, w * 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.fillRect(-w * 0.15, -h * 0.6, w * 0.1, w * 0.1); ctx.fillRect(w * 0.05, -h * 0.6, w * 0.1, w * 0.1);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function eyes(w, h, dir, pupil) {
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-w * 0.17 + dir * w * 0.06, -h * 0.55, w * 0.13, h * 0.16, 0, 0, 7); ctx.ellipse(w * 0.17 + dir * w * 0.06, -h * 0.55, w * 0.13, h * 0.16, 0, 0, 7); ctx.fill();
  ctx.fillStyle = pupil;
  ctx.beginPath(); ctx.arc(-w * 0.17 + dir * w * 0.1, -h * 0.53, w * 0.06, 0, 7); ctx.arc(w * 0.17 + dir * w * 0.1, -h * 0.53, w * 0.06, 0, 7); ctx.fill();
}
// Пинки: a round pink hero with big eyes and little feet; squashes on landing, stretches on jumps.
function drawHero(now) {
  const h = hero;
  if (h.inv > 0 && Math.floor(now * 14) % 2 === 0) return;
  const w = h.w * TS, hh = h.h * TS, cx = (h.x + h.w / 2) * TS, by = (h.y + h.h) * TS;
  const sq = state === 'dead' ? 0 : h.sq, sx = 1 + sq * 0.3, sy = 1 - sq * 0.3;
  ctx.save(); ctx.translate(cx, by);
  if (state === 'dead') ctx.rotate(Math.min(deadT * 6, Math.PI));
  ctx.scale(sx, sy);
  if (h.shield) { ctx.fillStyle = `rgba(95,211,243,${0.28 + Math.sin(now * 8) * 0.08})`; ctx.beginPath(); ctx.arc(0, -hh * 0.5, w * 0.95, 0, 7); ctx.fill(); }
  const run = h.ground && Math.abs(h.vx) > 0.5 ? Math.sin(h.t * 22) : 0;
  ctx.fillStyle = '#c23a7a';                                     // feet
  ctx.beginPath(); ctx.ellipse(-w * 0.22 + run * w * 0.1, -hh * 0.05, w * 0.18, hh * 0.09, 0, 0, 7); ctx.ellipse(w * 0.22 - run * w * 0.1, -hh * 0.05, w * 0.18, hh * 0.09, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff5fa8';                                     // body
  ctx.beginPath(); ctx.ellipse(0, -hh * 0.52, w * 0.52, hh * 0.47, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-w * 0.2, -hh * 0.78, w * 0.14, hh * 0.08, -0.5, 0, 7); ctx.fill();
  const f = h.face, look = state === 'dead' ? 0 : f * w * 0.1;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-w * 0.14 + look, -hh * 0.58, w * 0.14, hh * 0.17, 0, 0, 7); ctx.ellipse(w * 0.16 + look, -hh * 0.58, w * 0.14, hh * 0.17, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1530';
  if (state === 'dead') { ctx.font = `900 ${Math.round(hh * 0.3)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('x', -w * 0.14, -hh * 0.58); ctx.fillText('x', w * 0.16, -hh * 0.58); }
  else { ctx.beginPath(); ctx.arc(-w * 0.12 + look * 1.4, -hh * 0.56, w * 0.065, 0, 7); ctx.arc(w * 0.18 + look * 1.4, -hh * 0.56, w * 0.065, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffb3d6'; ctx.beginPath(); ctx.ellipse(-w * 0.3 + look, -hh * 0.38, w * 0.08, hh * 0.05, 0, 0, 7); ctx.ellipse(w * 0.32 + look, -hh * 0.38, w * 0.08, hh * 0.05, 0, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- results & menus ---------- */
function showResult() {
  G.wake(false);
  const s = 1 + (coins >= coinTotal ? 1 : 0) + (deaths === 0 ? 1 : 0);
  const old = stars[li] || 0;
  if (s > old) { stars[li] = s; G.set('jump.stars', stars); }
  $('stars').innerHTML = '★'.repeat(s) + `<i>${'★'.repeat(3 - s)}</i>`;
  const mm = Math.floor(time / 60), ss = String(Math.floor(time % 60)).padStart(2, '0');
  $('stats').innerHTML = `<span>Монетки: ${coins} из ${coinTotal}${coins >= coinTotal ? ' ★' : ''}</span><span>Падений: ${deaths}${deaths === 0 ? ' ★' : ''}</span><span>Время: ${mm}:${ss}</span>`;
  $('overTitle').textContent = li === LEVELS.length - 1 ? 'Замок пройден!' : 'Уровень пройден!';
  $('next').hidden = li >= LEVELS.length - 1;
  $('hud').hidden = true; $('pad').hidden = true; $('over').hidden = false;
}
function levelMenu() {
  state = 'menu'; G.wake(false);
  ['over', 'pause'].forEach(id => { $(id).hidden = true; });
  $('hud').hidden = true; $('pad').hidden = true;
  $('levels').innerHTML = LEVELS.map((l, i) => {
    const open = i === 0 || (stars[i - 1] || 0) > 0, s = stars[i] || 0;
    return `<button class="lvl" type="button" data-l="${i}" ${open ? '' : 'disabled'}><b>${open ? i + 1 : '🔒'}</b><span>${l.name}</span><span class="st">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</span></button>`;
  }).join('');
  $('levels').querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { G.sfx('tap'); startLevel(+b.dataset.l); }));
  $('menu').hidden = false;
}
function pause() { if (state !== 'play') return; state = 'paused'; G.wake(false); $('pause').hidden = false; input.dir = 0; input.jump = false; }
$('resume').addEventListener('click', () => { $('pause').hidden = true; state = 'play'; G.wake(true); });
$('restart').addEventListener('click', () => startLevel(li));
$('toLevels').addEventListener('click', levelMenu);
$('again').addEventListener('click', () => startLevel(li));
$('next').addEventListener('click', () => startLevel(li + 1));
$('overLevels').addEventListener('click', levelMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- controls ---------- */
// The whole pad is the hit area: left of the jump button steers (slide between ◀ and ▶ without lifting),
// the rest jumps. Thumbs don't have to land exactly on a button.
const padEl = $('pad'), dpad = $('dpad'), jb = $('jumpBtn'), dpadPtr = new Map(), jumpPtr = new Set();
function syncDir() {
  const ds = [...dpadPtr.values()]; input.dir = ds.length ? ds[ds.length - 1] : 0;
  dpad.querySelectorAll('span').forEach(s => s.classList.toggle('on', ds.includes(+s.dataset.d)));
}
const dirAt = e => { const r = dpad.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? -1 : 1; };
const isJumpSide = e => { const r = jb.getBoundingClientRect(), d = dpad.getBoundingClientRect(); return e.clientX > (d.right + r.left) / 2; };
const jumpDown = () => { input.jump = true; input.jumpAt = hero ? hero.t : 0; jb.classList.add('on'); };
const jumpUp = () => { if (jumpPtr.size) return; input.jump = false; jb.classList.remove('on'); };
padEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { padEl.setPointerCapture(e.pointerId); } catch {}
  if (isJumpSide(e)) { jumpPtr.add(e.pointerId); jumpDown(); G.buzz(6); }
  else { dpadPtr.set(e.pointerId, dirAt(e)); syncDir(); G.buzz(5); }
});
padEl.addEventListener('pointermove', e => { if (dpadPtr.has(e.pointerId)) { const d = dirAt(e); if (d !== dpadPtr.get(e.pointerId)) { dpadPtr.set(e.pointerId, d); syncDir(); G.buzz(4); } } });
const padUp = e => {
  if (dpadPtr.delete(e.pointerId)) syncDir();
  if (jumpPtr.delete(e.pointerId)) jumpUp();
};
padEl.addEventListener('pointerup', padUp); padEl.addEventListener('pointercancel', padUp);
const keys = new Set();
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.add(-1);
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.add(1);
  if (['Space', 'ArrowUp', 'KeyW', 'KeyZ'].includes(e.code)) { e.preventDefault(); jumpDown(); }
  if (e.code === 'Escape') pause();
  input.dir = keys.has(1) && !keys.has(-1) ? 1 : keys.has(-1) && !keys.has(1) ? -1 : (dpadPtr.size ? input.dir : 0);
});
addEventListener('keyup', e => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.delete(-1);
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.delete(1);
  if (['Space', 'ArrowUp', 'KeyW', 'KeyZ'].includes(e.code)) jumpUp();
  input.dir = keys.has(1) ? 1 : keys.has(-1) ? -1 : 0;
});

G.topbar({ pause });
layout(); levelMenu();
// a level drawn behind the menu so it doesn't open on an empty screen
load(0, false);
window.__jump = { input, get hero() { return hero; }, get state() { return state; }, get enemies() { return enemies; }, get coins() { return coins; }, get grid() { return grid; }, get cp() { return cp; }, startLevel, LEVELS, get camX() { return camX; } };   // for automated checks
window.__jumpPlats = () => plats;
// test hooks: save/restore the whole simulation and step it, so a planning bot can try moves ahead
window.__jumpSim = {
  snap: () => structuredClone({ hero: { ...hero, plat: hero.plat ? plats.indexOf(hero.plat) : -1 }, enemies, plats, berries, grid, coins, state, time, input: { ...input } }),
  restore: s => { const c = structuredClone(s); ({ enemies, plats, berries, grid, coins, state, time } = c); hero = c.hero; hero.plat = c.hero.plat >= 0 ? plats[c.hero.plat] : null; Object.assign(input, c.input); },
  step: () => { if (state === 'play') { time += STEP; stepPlats(STEP); stepHero(STEP); stepEnemies(STEP); stepBerries(STEP); } },
  quiet: on => { fx.quiet = on; },
};
})();
</script>
</body>
